name: StatPeek
options:
  organizationName: ZY
  deploymentTarget:
    macOS: '13.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: '-'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: 1
targets:
  StatPeek:
    type: application
    platform: macOS
    sources:
      - StatPeek
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zyapps.StatPeek
        PRODUCT_NAME: StatPeek
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: StatPeek
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: 'Copyright © 2026 ZY'
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - sdk: AppKit.framework
      - sdk: IOKit.framework
  StatPeekTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - StatPeekTests
      - path: StatPeek/Metrics.swift
      - path: StatPeek/MetricSelection.swift
      - path: StatPeek/SystemSampler.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zyapps.StatPeekTests
schemes:
  StatPeek:
    build:
      targets:
        StatPeek: all
        StatPeekTests: [test]
    test:
      targets:
        - StatPeekTests
